<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="978" height="328" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <!-- request -->
  <rect x="20" y="40" width="200" height="214" rx="12" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="120" y="72" text-anchor="middle" font-size="13" fill="#8b949e" font-weight="600">YOU ASK</text>
  <text text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">
    <tspan x="120" y="122">"Wrap linear.app</tspan>
    <tspan x="120" y="146">as a Mac app with</tspan>
    <tspan x="120" y="170">tabs and themes"</tspan>
  </text>

  <!-- without lane -->
  <text x="240" y="34" font-size="14" font-weight="700" fill="#ff7b72">😩 Without the skill</text>
  <rect x="240" y="44" width="720" height="84" rx="10" fill="#2d1215" stroke="#f85149" stroke-width="1.5"/>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="256" y="64" width="80" height="44" rx="8" fill="#49191c"/><text x="296" y="91" fill="#ffdcd7">Scaffold</text>
    <rect x="344" y="64" width="88" height="44" rx="8" fill="#49191c"/><text x="388" y="91" fill="#ffdcd7">Keys dead</text>
    <rect x="440" y="64" width="104" height="44" rx="8" fill="#49191c"/><text x="492" y="91" fill="#ffdcd7">White flash</text>
    <rect x="552" y="64" width="120" height="44" rx="8" fill="#49191c"/><text x="612" y="91" fill="#ffdcd7">Blank sign-in</text>
    <rect x="680" y="64" width="136" height="44" rx="8" fill="#49191c"/><text x="748" y="91" fill="#ffdcd7">Patch + rebuild</text>
    <rect x="824" y="64" width="120" height="44" rx="8" fill="#4d3800" stroke="#d29922" stroke-width="1.5"/><text x="884" y="91" fill="#f2cc60">Works · try 4</text>
  </g>

  <!-- with lane -->
  <text x="240" y="160" font-size="14" font-weight="700" fill="#7ee787">😌 With the skill</text>
  <rect x="240" y="170" width="720" height="84" rx="10" fill="#0f2a1a" stroke="#3fb950" stroke-width="1.5"/>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="256" y="190" width="136" height="44" rx="8" fill="#15432a"/><text x="324" y="217" fill="#d2f8dc">Reads the rules</text>
    <rect x="400" y="190" width="128" height="44" rx="8" fill="#15432a"/><text x="464" y="217" fill="#d2f8dc">Builds the app</text>
    <rect x="536" y="190" width="120" height="44" rx="8" fill="#1a5c34" stroke="#3fb950" stroke-width="1.5"/><text x="596" y="217" fill="#aff5b4">Works · try 1</text>
    <rect x="664" y="186" width="280" height="52" rx="8" fill="none" stroke="#7ee787" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="804" y="209" fill="#aff5b4" font-size="15">Time you get back</text>
    <text x="804" y="228" fill="#7ee787" font-size="12" font-weight="500">no Xcode, no retries</text>
  </g>

  <!-- time arrow -->
  <line x1="240" y1="290" x2="950" y2="290" stroke="#8b949e" stroke-width="2"/>
  <polygon points="960,290 948,284 948,296" fill="#8b949e"/>
  <text x="600" y="314" text-anchor="middle" font-size="13" fill="#8b949e">time →</text>
</svg>
